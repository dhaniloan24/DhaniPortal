<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | Dhani Portal</title><link rel="icon" href="/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><script src="/admin.js" defer></script></head>
<body><header class="site-header"><a class="brand" href="/"><img src="/logo.svg" alt="" class="brand-mark"><span><strong>Dhani Portal</strong><small>ADMINISTRATION</small></span></a><nav><a href="/">Public website</a></nav></header>
<main class="section form-section"><div class="section-heading"><span class="eyebrow">Authorized access only</span><h2>Admin dashboard</h2><p>Sign in to review applications and record authorized status decisions.</p></div>

<section id="dashboard" hidden><div class="admin-toolbar"><h3>Applications</h3><button id="refresh" class="button primary">Refresh</button><button id="logout" class="button">Log out</button></div><div id="admin-result" class="notice" hidden></div><div id="application-list" class="admin-list"></div></section></main>
